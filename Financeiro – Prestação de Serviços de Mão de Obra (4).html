<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Financeiro – Prestação de Serviços de Mão de Obra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#66727f;--bd:#dde3e9;--pr:#1d4ed8;--prt:#fff;--rd:#b42318;--am:#b54708;--gr:#0b6e4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b222a;--tx:#e8edf2;--mu:#9aa6b2;--bd:#2c3640;--pr:#6ea0ff;--prt:#0a1630;--rd:#ff8a80;--am:#ffb84d;--gr:#2fbf8f}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b222a;--tx:#e8edf2;--mu:#9aa6b2;--bd:#2c3640;--pr:#6ea0ff;--prt:#0a1630;--rd:#ff8a80;--am:#ffb84d;--gr:#2fbf8f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}header h1{margin:0;font-size:17px}header small{color:var(--mu)}
body{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1}
nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:10px;background:var(--card);border-right:1px solid var(--bd)}
nav button{text-align:left;border:0;background:none;color:var(--tx);padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}
@media (max-width:760px){body{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav button{white-space:nowrap}}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{width:100%;max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:12px;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);width:100%}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:none;color:var(--tx);border:1px solid var(--bd);font-weight:400;padding:4px 8px;font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid var(--bd)}.ok{color:var(--gr)}.bad{color:var(--rd)}.warn{color:var(--am)}
.bar{height:8px;background:var(--pr);border-radius:4px;min-width:2px}
.grp td{background:var(--bg);font-weight:700}.sub td{font-weight:600;color:var(--mu)}
.pr{display:none}
@media print{header,nav,.np{display:none!important}.pr{display:block}body{display:block;background:#fff;color:#000}@page{size:A4 portrait;margin:12mm}.card{border:0;padding:0}:root{--bg:#eee;--tx:#000;--mu:#444;--bd:#bbb;--card:#fff}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head><body>
<header><span id="who" class="np" style="float:right;color:var(--mu);font-size:12px"></span><h1>Sistema Financeiro</h1><small>Prestação de serviços de mão de obra — dados compartilhados entre os usuários autorizados</small></header>
<nav id="nav"></nav><main id="app"></main><div id="modal" class="np" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;padding:12px"></div>
<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw';document.body.appendChild(t);setTimeout(()=>t.remove(),5000)};window.alert=toast;
const ask=m=>new Promise(ok=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px';d.innerHTML=`<div class="card" style="max-width:360px;margin:0"><p>${m}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" id="a_n">Cancelar</button><button class="btn" id="a_s">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#a_n').onclick=()=>{d.remove();ok(false)};d.querySelector('#a_s').onclick=()=>{d.remove();ok(true)}});

let db={forn:[],cc:[],insumo:[],conta:[],banco:[],rec:[],setor:[],empresa:[]},FS=null,CW=true,ASSETS=null,ME=null;const names={};
const uid=()=>Math.random().toString(36).slice(2,9);
const SETORES=['Administrativo','Operacional','RH','Frotas','Suprimentos','Custeio'];
const ENTS=Object.keys(db),shadow=Object.fromEntries(ENTS.map(e=>[e,{}]));let _sv=Promise.resolve();
function save(){_sv=_sv.then(async()=>{if(!FS)return;try{for(const e of ENTS){const sh=shadow[e],ids=new Set(db[e].map(r=>r.id));
for(const r of db[e]){const s=JSON.stringify(r);if(sh[r.id]!==s){sh[r.id]=s;await FS.doc(e+'/'+r.id).set(r)}}
for(const id of Object.keys(sh))if(!ids.has(id)){delete sh[id];await FS.doc(e+'/'+id).delete()}}}catch(x){alert('Não foi possível salvar (sem permissão de edição?): '+(x.message||x.code||x))}})}
async function impLocal(){let o;try{o=JSON.parse(localStorage.getItem('finmo'))}catch(e){}if(!o)return alert('Nada para importar.');if(!await ask('Importar os dados salvos neste navegador para o sistema compartilhado? (anexos antigos não são importados)'))return;
const sm={};(o.setor||[]).forEach(s=>{const x=db.setor.find(y=>y.nome==s.nome);if(x)sm[s.id]=x.id;else db.setor.push(s)});(o.conta||[]).forEach(c=>{c.setor=sm[c.setor]||c.setor;c.docs=[]});
ENTS.filter(e=>e!='setor').forEach(e=>(o[e]||[]).forEach(r=>{if(!db[e].some(x=>x.id==r.id))db[e].push(r)}));save();go(cur);try{localStorage.removeItem('finmo')}catch(e){}}
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date().toISOString().slice(0,10);
const nm=(t,id)=>(db[t].find(x=>x.id==id)||{}).nome||'—';
const sum=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const F={
forn:[{k:'nome',l:'Razão social / Nome'},{k:'doc',l:'CNPJ/CPF'},{k:'pgto',l:'Forma de pagamento',o:['PIX','Boleto','TED','Remessa']},{k:'tconta',l:'Tipo de conta',o:['Corrente','Poupança','Pagamento','Salário']},{k:'banco',l:'Banco'},{k:'ag',l:'Agência'},{k:'conta',l:'Conta'},{k:'pix',l:'Chave PIX'},{k:'tel',l:'Contato (tel/e-mail)'}],
empresa:[{k:'nome',l:'Razão social'},{k:'cnpj',l:'CNPJ'},{k:'banco',l:'Banco'},{k:'ag',l:'Agência'},{k:'conta',l:'Conta'},{k:'tel',l:'Contato (tel/e-mail)'},{k:'end',l:'Endereço'}],
cc:[{k:'nome',l:'CC/Equipe'},{k:'cod',l:'Código'},{k:'resp',l:'Responsável'}],
setor:[{k:'nome',l:'Setor'}],
insumo:[{k:'nome',l:'Insumo'}],
rec:[{k:'desc',l:'Descrição / Medição'},{k:'data',l:'Data',t:'date'},{k:'valor',l:'Valor',t:'number',m:1},{k:'cc',l:'CC/Equipe',s:'cc'}]};
const opt=(src,sel)=>'<option value="">— selecione —</option>'+db[src].map(o=>`<option value="${o.id}" ${o.id==sel?'selected':''}>${o.nome}</option>`).join('');
const inp=(p,f)=>`<label>${f.l}${f.o?`<select id="${p}_${f.k}"><option value="">—</option>${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:f.s?`<select id="${p}_${f.k}">${opt(f.s)}</select>`:`<input id="${p}_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="0.01"':''}>`}</label>`;
const disp=(f,v)=>f.s?nm(f.s,v):f.t=='date'?D(v):f.m?R(v):(v||'');
function crud(ent,title){const fs=F[ent];
return `<div class="card"><h2>${title}</h2><div class="grid">${fs.map(f=>inp(ent,f)).join('')}<button class="btn" onclick="addE('${ent}')">Adicionar</button></div></div>
<div class="card tw"><table><tr>${fs.map(f=>`<th>${f.l}</th>`).join('')}<th></th></tr>${db[ent].map(r=>`<tr>${fs.map(f=>`<td class="${f.m?'n':''}">${disp(f,r[f.k])}</td>`).join('')}<td><button class="btn s" onclick="del('${ent}','${r.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="12">Nenhum registro.</td></tr>'}</table></div>`}
function addE(ent){const o={id:uid()};F[ent].forEach(f=>o[f.k]=$(`#${ent}_${f.k}`).value);if(!(o.nome||o.desc))return alert('Preencha o nome/descrição.');db[ent].push(o);save();go(cur)}
const uso=(e,id)=>e=='setor'?db.conta.filter(c=>c.setor==id).length:e=='cc'?db.conta.filter(c=>c.cc==id).length+db.rec.filter(c=>c.cc==id).length:e=='insumo'?db.conta.filter(c=>c.ins==id).length:e=='forn'?db.conta.filter(c=>c.forn==id).length:0;
async function del(ent,id){const n=uso(ent,id);if(!await ask(n?`Este cadastro está em uso em ${n} lançamento(s); eles ficarão sem este vínculo. Excluir mesmo assim?`:'Excluir este registro?'))return;db[ent]=db[ent].filter(x=>x.id!=id);save();go(cur)}

/* Contas a pagar */
function viewConta(){const l=[...db.conta].sort((a,b)=>a.venc>b.venc?1:-1);
return `<div class="card"><h2>Novo lançamento – contas a pagar</h2><div class="grid">
<label style="grid-column:1/-1">Descrição do pagamento<input id="c_desc" placeholder="Ex.: Medição de setembro – equipe Norte / NF 1234"></label>
<label>Empresa<select id="c_emp">${opt('empresa',(db.empresa[0]||{}).id)}</select></label>
<label>Fornecedor<select id="c_forn">${opt('forn')}</select><button type="button" class="btn s" onclick="go('forn')">+ Fornecedor não cadastrado? Cadastrar</button></label>
<label>Insumo<select id="c_ins">${opt('insumo')}</select></label>
<label>Setor<select id="c_setor">${opt('setor')}</select></label>
<label>CC/Equipe<select id="c_cc">${opt('cc')}</select></label>
<label>1º vencimento<input id="c_venc" type="date" value="${today()}" onchange="genParc()"></label>
<label>Valor total<input id="c_valor" type="number" step="0.01" oninput="genParc()"></label>
<label>Parcelas (boletos)<input id="c_parc" type="number" min="1" max="60" value="1" oninput="genParc()"></label>
<label>Período dos boletos<select id="c_per" onchange="genParc(true)"><option value="mes">Mensal</option><option value="30">A cada 30 dias</option><option value="15">A cada 15 dias</option><option value="7">Semanal</option><option value="manual">Manual (informar cada data)</option></select></label>
<div id="c_parcs" style="grid-column:1/-1"></div>
<label>Forma de pagamento<select id="c_pgto"><option value="">(do fornecedor)</option><option>PIX</option><option>Boleto</option><option>TED</option><option>Remessa</option></select></label>
<label style="grid-column:1/-1">Documentos (NF, boleto, comprovante – até 20 MB cada; em parcelados, vão na 1ª parcela)<input id="c_files" type="file" multiple></label>
<button class="btn" onclick="addConta()">Lançar</button></div></div>
<div class="card tw"><h2>Contas lançadas</h2><table><tr><th>Venc.</th><th>Descrição</th><th>Fornecedor</th><th>Insumo</th><th>Setor</th><th>CC/Equipe</th><th>Forma</th><th>Empresa</th><th class="n">Valor</th><th>Status</th><th>Docs</th><th>Por</th><th></th></tr>
${l.map(c=>{const late=c.status=='pendente'&&c.venc<today();return `<tr><td class="${late?'bad':''}">${D(c.venc)}${c.prorrog?` <span class="tag warn" title="Vencimento original: ${D(c.venc0)}">Prorrogada ${c.prorrog.length}x</span>`:''}</td><td>${c.desc}</td><td>${nm('forn',c.forn)}</td><td>${nm('insumo',c.ins)}</td><td>${nm('setor',c.setor)}</td><td>${nm('cc',c.cc)}</td><td>${c.pgto||''}</td><td>${nm('empresa',c.emp)}</td><td class="n">${R(c.valor)}</td><td><span class="tag ${c.status=='pago'?'ok':late?'bad':'warn'}">${c.status=='pago'?'Pago '+D(c.dpag):late?'Vencida':'A pagar'}</span></td><td><button class="btn s" onclick="docs('${c.id}')">📎 ${(c.docs||[]).length}</button> <button class="btn s" title="Solicitação de pagamento (PDF)" onclick="pdfSolic('${c.grp||c.id}')">📄</button></td><td>${names[c.by]||''}</td><td class="n"><button class="btn s" onclick="editarConta('${c.id}')">Editar</button> ${c.status=='pendente'?`<button class="btn s" onclick="prorrogar('${c.id}')">Prorrogar</button> <button class="btn s" onclick="pagar('${c.id}')">Pagar</button> `:''}<button class="btn s" onclick="del('conta','${c.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="12">Nenhuma conta.</td></tr>'}</table></div>`}
function genParc(force){const el=$('#c_parcs'),n=Math.min(60,parseInt($('#c_parc').value)||1),tot=+$('#c_valor').value||0,v0=$('#c_venc').value,per=$('#c_per').value;
if(n<2){el.innerHTML='';return}
const pd=[];for(let i=0;i<60;i++){const e=$('#p_v_'+i);if(!e)break;pd.push({v:e.value,m:e.dataset.m})}
const base=Math.floor(tot/n*100)/100,[y,mo,d]=(v0||'').split('-').map(Number);let h='';
for(let i=0;i<n;i++){const vl=i==n-1?+(tot-base*(n-1)).toFixed(2):base;let vc='',keep=false;
if(i==0)vc=v0;else if(!force&&pd[i]&&pd[i].m){vc=pd[i].v;keep=true}
else if(per!='manual'&&v0){let dt;if(per=='mes'){dt=new Date(y,mo-1+i,d);if(dt.getDate()!=d)dt=new Date(y,mo+i,0)}else dt=new Date(y,mo-1,d+i*(+per));vc=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
h+=`<tr><td>${i+1}/${n}</td><td><input id="p_v_${i}" type="date" value="${vc}" ${keep?'data-m="1"':''} oninput="this.dataset.m=1"></td><td><input id="p_m_${i}" type="number" step="0.01" value="${vl}" oninput="sumParc()"></td></tr>`}
el.innerHTML=`<h3>Boletos – vencimentos sugeridos pelo período; altere manualmente a data e o valor de cada parcela se precisar</h3><div class="tw"><table style="min-width:320px"><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th></tr>${h}</table></div><p id="p_sum"></p>`;sumParc()}
function sumParc(){const n=Math.min(60,parseInt($('#c_parc').value)||1),tot=+$('#c_valor').value||0;let s=0;for(let i=0;i<n;i++)s+=+($('#p_m_'+i)||{}).value||0;const ok=Math.abs(s-tot)<.01;$('#p_sum').innerHTML=`Soma das parcelas: <b class="${ok?'ok':'bad'}">${R(s)}</b> · Valor total: <b>${R(tot)}</b>${ok?'':' — diferença de '+R(s-tot)}`}
async function addConta(){const v=k=>$('#c_'+k).value;if(!v('desc')||!v('valor'))return alert('Informe a descrição e o valor.');
const f=db.forn.find(x=>x.id==v('forn')),n=Math.max(1,parseInt(v('parc'))||1),tot=+v('valor'),g=uid(),P=[];
if(n>1){if(!$('#p_m_0'))return alert('Defina as parcelas.');for(let i=0;i<n;i++){const d=$('#p_v_'+i).value,m=+$('#p_m_'+i).value;if(!d)return alert('Informe o vencimento da parcela '+(i+1)+'/'+n+'.');if(!(m>0))return alert('Informe o valor da parcela '+(i+1)+'/'+n+'.');P.push({venc:d,valor:m})}
const q=P.reduce((a,x)=>a+x.valor,0);if(Math.abs(q-tot)>.009&&!await ask('A soma das parcelas ('+R(q)+') difere do valor total ('+R(tot)+'). Lançar mesmo assim?'))return}
else P.push({venc:v('venc'),valor:tot});
const docs=await readFiles($('#c_files')),SOL='SP-'+today().replace(/-/g,'')+'-'+g.slice(0,4).toUpperCase();
P.forEach((x,i)=>db.conta.push({id:uid(),by:ME,grp:g,sol:SOL,status:'pendente',desc:v('desc')+(n>1?` (${i+1}/${n})`:''),forn:v('forn'),emp:v('emp'),ins:v('ins'),setor:v('setor'),cc:v('cc'),venc:x.venc,valor:x.valor,pgto:v('pgto')||(f&&f.pgto)||(n>1?'Boleto':''),docs:i==0?docs:[]}));
save();go('conta');solModal(g)}
function editarConta(id){const c=db.conta.find(x=>x.id==id),G=c.grp?db.conta.filter(x=>x.grp==c.grp):[c],sx=(c.desc.match(/ \(\d+\/\d+\)$/)||[''])[0],bd=c.desc.slice(0,c.desc.length-sx.length).replace(/"/g,'&quot;');
openM(`<h2>Editar conta a pagar</h2><div class="grid"><label style="grid-column:1/-1">Descrição do pagamento<input id="e_desc" value="${bd}"></label>
<label>Empresa<select id="e_emp">${opt('empresa',c.emp)}</select></label><label>Fornecedor<select id="e_forn">${opt('forn',c.forn)}</select></label>
<label>Insumo<select id="e_ins">${opt('insumo',c.ins)}</select></label><label>Setor<select id="e_setor">${opt('setor',c.setor)}</select></label><label>CC/Equipe<select id="e_cc">${opt('cc',c.cc)}</select></label>
<label>Vencimento<input id="e_venc" type="date" value="${c.venc}"></label><label>Valor<input id="e_valor" type="number" step="0.01" value="${c.valor}"></label>
<label>Forma de pagamento<select id="e_pgto"><option value="">—</option>${['PIX','Boleto','TED','Remessa'].map(o=>`<option ${o==c.pgto?'selected':''}>${o}</option>`).join('')}</select></label></div>
${G.length>1?`<p><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="e_all" style="width:auto"> Aplicar descrição, empresa, fornecedor, insumo, setor, CC/Equipe e forma às ${G.length} parcelas</label></p>`:''}
<p><button class="btn" onclick="saveConta('${id}')">Salvar alterações</button></p>`)}
function saveConta(id){const c=db.conta.find(x=>x.id==id),v=k=>$('#e_'+k).value;if(!v('desc').trim()||!(+v('valor')>0)||!v('venc'))return alert('Informe a descrição, o vencimento e um valor maior que zero.');
const G=$('#e_all')&&$('#e_all').checked?db.conta.filter(x=>x.grp==c.grp):[c];
G.forEach(x=>{const sx=(x.desc.match(/ \(\d+\/\d+\)$/)||[''])[0];x.desc=v('desc').trim()+sx;x.emp=v('emp');x.forn=v('forn');x.ins=v('ins');x.setor=v('setor');x.cc=v('cc');x.pgto=v('pgto');x.ed=today();x.edBy=ME||''});
c.venc=v('venc');c.valor=+(+v('valor')).toFixed(2);save();closeM();go(cur)}
function prorrogar(id){const c=db.conta.find(x=>x.id==id),h=(c.prorrog||[]).map(p=>`<tr><td>${D(p.de)} → ${D(p.para)}</td><td>${p.motivo||''}</td><td class="n">${p.acres?R(p.acres):''}</td><td>${D(p.em)}</td></tr>`).join('');
openM(`<h2>Prorrogar pagamento</h2><p>${c.desc}<br>Vencimento atual: <b>${D(c.venc)}</b> · Valor: <b>${R(c.valor)}</b></p><div class="grid"><label>Nova data de vencimento<input id="m_venc" type="date" value="${c.venc}"></label><label>Juros/multa a acrescentar (opcional)<input id="m_acr" type="number" step="0.01" placeholder="0,00"></label><label style="grid-column:1/-1">Motivo da prorrogação<input id="m_mot" placeholder="Ex.: negociado com o fornecedor"></label></div><p><button class="btn" onclick="savePror('${id}')">Confirmar prorrogação</button></p>${h?`<h3>Histórico de prorrogações</h3><div class="tw"><table style="min-width:300px"><tr><th>Datas</th><th>Motivo</th><th class="n">Acréscimo</th><th>Registrado em</th></tr>${h}</table></div>`:''}`)}
function savePror(id){const c=db.conta.find(x=>x.id==id),v=$('#m_venc').value,a=+$('#m_acr').value||0;if(!v)return alert('Informe a nova data.');if(v==c.venc&&!a)return alert('Informe uma data diferente do vencimento atual.');
(c.prorrog=c.prorrog||[]).push({de:c.venc,para:v,motivo:$('#m_mot').value.trim(),acres:a,em:today(),por:ME||''});if(!c.venc0)c.venc0=c.venc;c.venc=v;if(a)c.valor=+(c.valor+a).toFixed(2);save();closeM();go(cur)}
function editVenc(id){const c=db.conta.find(x=>x.id==id);openM(`<h2>Alterar vencimento</h2><p>${c.desc}<br>Vencimento atual: <b>${D(c.venc)}</b></p><label>Novo vencimento<input id="m_venc" type="date" value="${c.venc}"></label><p><button class="btn" onclick="saveVenc('${id}')">Salvar</button></p>`)}
function saveVenc(id){const v=$('#m_venc').value;if(!v)return alert('Informe a data.');const c=db.conta.find(x=>x.id==id);c.venc=v;save();closeM();go(cur)}
function pagar(id){const c=db.conta.find(x=>x.id==id);c.status='pago';c.dpag=today();save();go(cur)}

const openM=h=>{$('#modal').innerHTML=`<div class="card" style="max-width:760px;margin:4vh auto;max-height:90vh;overflow:auto"><button class="btn s" style="float:right" onclick="closeM()">Fechar</button>${h}</div>`;$('#modal').style.display='block'};

async function readFiles(inp){const out=[];if(!inp.files.length)return out;if(!ASSETS){alert('Anexos indisponíveis para o seu perfil.');return out}
for(const f of inp.files){try{const u=await ASSETS.upload(f);out.push({id:uid(),name:f.name,type:f.type,url:u.url})}catch(e){alert(f.name+': falha no envio ('+(e.message||e.code)+')')}}return out}
function docs(id){const c=db.conta.find(x=>x.id==id);openM(`<h2>Documentos – ${c.desc}</h2>${(c.docs||[]).map(d=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0"><span style="flex:1">${d.name}</span><button class="btn s" onclick="ver('${id}','${d.id}')">Ver</button><button class="btn s" onclick="rmDoc('${id}','${d.id}')">Remover</button></div>`).join('')||'<p>Nenhum documento anexado.</p>'}<label>Anexar documentos<input id="m_files" type="file" multiple onchange="addDocs('${id}')"></label>`)}

function ver(cid,did){const d=db.conta.find(x=>x.id==cid).docs.find(x=>x.id==did);let h;
if((d.type||'').startsWith('image/'))h=`<img src="${d.url}" style="max-width:100%">`;
else if(d.type=='application/pdf')h=`<iframe src="${d.url}" style="width:100%;height:70vh;border:0"></iframe>`;
else h='<p>Pré-visualização indisponível para este tipo de arquivo.</p>';h+=`<p><a href="${d.url}" target="_blank" rel="noopener">Abrir em nova aba</a></p>`;
openM(`<h2>${d.name}</h2>${h}<p><button class="btn s" onclick="docs('${cid}')">← Voltar</button></p>`)}

l.forEach(c=>{const a=gk(c,g1),b=g2?gk(c,g2):'';((gs[a]=gs[a]||{})[b]=gs[a][b]||[]).push(c)});
let h='';Object.keys(gs).sort().forEach(a=>{h+=`<tr class="grp"><td colspan="7">${L[g1]}: ${a}</td></tr>`;let st=0;
Object.keys(gs[a]).sort().forEach(b=>{if(g2)h+=`<tr class="grp"><td colspan="7" style="font-weight:600">&nbsp;&nbsp;${L[g2]}: ${b}</td></tr>`;
gs[a][b].forEach(c=>{const f=db.forn.find(x=>x.id==c.forn)||{};h+=`<tr><td>${D(c.venc)}</td><td>${c.desc}</td><td>${f.nome||'—'}<br><small>${c.pgto=='PIX'?'PIX: '+(f.pix||'—'):f.banco?`${f.banco} Ag ${f.ag||''} C ${f.conta||''}`:''}</small></td><td>${nm('insumo',c.ins)}</td><td>${c.pgto||''}</td><td>${c.status}</td><td class="n">${R(c.valor)}</td></tr>`});
const t=sum(gs[a][b]);st+=t;if(g2)h+=`<tr class="sub"><td colspan="6">Subtotal ${b}</td><td class="n">${R(t)}</td></tr>`});
h+=`<tr class="sub"><td colspan="6">TOTAL ${a}</td><td class="n">${R(st)}</td></tr>`});
return `<div class="card"><h2>Relatório de contas a pagar</h2><div class="grid np"><label>De<input id="r_i" type="date" value="${dI}"></label><label>Até<input id="r_f" type="date" value="${dF}"></label>
<label>Empresa<select id="r_e"><option value="">Todas</option>${db.empresa.map(e=>`<option value="${e.id}" ${e.id==empF?'selected':''}>${e.nome}</option>`).join('')}</select></label>
<label>Setor<select id="r_s">${flt('setor',fS)}</select></label><label>CC/Equipe<select id="r_c">${flt('cc',fC)}</select></label><label>Insumo<select id="r_n">${flt('insumo',fI)}</select></label>
<label>Agrupar por<select id="r_g1">${gopt(g1)}</select></label><label>Depois por<select id="r_g2">${gopt(g2,1)}</select></label>
<button class="btn" onclick="gerar()">Gerar relatório</button><button class="btn s" onclick="pdfDia()">⬇ Baixar PDF</button><button class="btn s" onclick="imprimir()">🖨 Imprimir</button></div>
<p class="np" style="color:var(--mu);font-size:12px">O PDF é gerado em A4 retrato com os filtros e o agrupamento escolhidos acima.</p>
<h2 class="pr" style="margin-top:8px">${e0.nome?e0.nome+(e0.cnpj?' – CNPJ '+e0.cnpj:'')+'<br>':''}Contas a pagar – ${per}</h2>
<div class="kpis" style="margin-top:12px"><div class="kpi"><span>Total do período</span><b>${R(sum(l))}</b></div><div class="kpi"><span>Lançamentos</span><b>${l.length}</b></div><div class="kpi"><span>PIX</span><b>${R(sum(l.filter(c=>c.pgto=='PIX')))}</b></div><div class="kpi"><span>Boleto</span><b>${R(sum(l.filter(c=>c.pgto=='Boleto')))}</b></div><div class="kpi"><span>TED</span><b>${R(sum(l.filter(c=>c.pgto=='TED')))}</b></div><div class="kpi"><span>Remessa</span><b>${R(sum(l.filter(c=>c.pgto=='Remessa')))}</b></div></div>
<div class="tw"><table><tr><th>Venc.</th><th>Descrição</th><th>Fornecedor / dados</th><th>Insumo</th><th>Forma</th><th>Status</th><th class="n">Valor</th></tr>${h||'<tr><td colspan="7">Nenhuma conta no período/filtros selecionados.</td></tr>'}${l.length?`<tr class="sub"><td colspan="6">TOTAL GERAL</td><td class="n">${R(sum(l))}</td></tr>`:''}</table></div></div>`}

/* Conciliação */
function viewBanco(){const pagos=db.conta.filter(c=>c.status=='pago');const usados=db.banco.map(b=>b.conta).filter(Boolean);
const livres=pagos.filter(c=>!usados.includes(c.id));const conc=db.banco.filter(b=>b.conta).length;
return `<div class="card"><h2>Conciliação bancária</h2><div class="kpis"><div class="kpi"><span>Linhas do extrato</span><b>${db.banco.length}</b></div><div class="kpi"><span>Conciliadas</span><b class="ok">${conc}</b></div><div class="kpi"><span>Sem correspondência</span><b class="bad">${db.banco.length-conc}</b></div><div class="kpi"><span>Pagas sem extrato</span><b class="warn">${livres.length}</b></div></div>
<div class="grid"><label>Data<input id="b_data" type="date" value="${today()}"></label><label>Descrição<input id="b_desc"></label><label>Valor da saída<input id="b_valor" type="number" step="0.01"></label><button class="btn" onclick="addB()">Adicionar linha</button></div>
<h3>Ou cole o extrato (dd/mm/aaaa;descrição;valor)</h3><textarea id="b_csv" rows="3" placeholder="05/10/2026;PIX ENVIADO FORNECEDOR;1500,00"></textarea>
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn s" onclick="impB()">Importar</button><button class="btn" onclick="autoB()">Conciliar automaticamente (mesmo valor)</button></div></div>
<div class="card tw"><table><tr><th>Data</th><th>Descrição</th><th class="n">Valor</th><th>Conta vinculada</th><th></th></tr>${db.banco.map(b=>`<tr><td>${D(b.data)}</td><td>${b.desc}</td><td class="n">${R(b.valor)}</td><td>${b.conta?`<span class="ok">✔ ${(db.conta.find(c=>c.id==b.conta)||{}).desc}</span>`:`<select onchange="linkB('${b.id}',this.value)"><option value="">— vincular —</option>${livres.map(c=>`<option value="${c.id}">${c.desc} · ${R(c.valor)}</option>`).join('')}</select>`}</td><td><button class="btn s" onclick="del('banco','${b.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="5">Sem lançamentos no extrato.</td></tr>'}</table></div>`}
function addB(){if(!$('#b_valor').value)return;db.banco.push({id:uid(),data:$('#b_data').value,desc:$('#b_desc').value,valor:Math.abs(+$('#b_valor').value)});save();go('banco')}
function impB(){$('#b_csv').value.split('\n').forEach(l=>{const p=l.split(';');if(p.length<3)return;const d=p[0].trim().split('/');const v=Math.abs(parseFloat(p[2].replace(/\./g,'').replace(',','.')));if(d.length==3&&v)db.banco.push({id:uid(),data:`${d[2]}-${d[1]}-${d[0]}`,desc:p[1].trim(),valor:v})});save();go('banco')}
function linkB(id,c){if(!c)return;db.banco.find(b=>b.id==id).conta=c;save();go('banco')}
function autoB(){const u=db.banco.map(b=>b.conta).filter(Boolean);
db.banco.filter(b=>!b.conta).forEach(b=>{const c=db.conta.find(c=>c.status=='pago'&&!u.includes(c.id)&&Math.abs(c.valor-b.valor)<.005);if(c){b.conta=c.id;u.push(c.id)}});save();go('banco')}

const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&$('#modal').style.display=='none')go(cur)},er=>alert('Erro de leitura: '+er.message)))}catch(x){console.error(x)}})();
